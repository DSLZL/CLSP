version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@4.0.0

jobs:
  ts-check:
    docker:
      - image: cimg/node:24.19.0
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install VS Code dependencies
          working_directory: ~/project/vscode
          command: bun install --frozen-lockfile
      - run:
          name: Check VS Code extension
          working_directory: ~/project/vscode
          command: bun run check

  sonar-scan:
    docker:
      - image: cimg/rust:1.88.0
    steps:
      - checkout:
          method: full
      - sonarcloud/scan

workflows:
  main:
    jobs:
      - ts-check
      - sonar-scan:
          requires:
            - ts-check
          context: SonarCloud
