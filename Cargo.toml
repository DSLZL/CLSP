[package]
name = "clsp"
version = "0.2.6"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "A Windows-first LSP companion for Codex CLI"
repository = "https://github.com/DSLZL/CLSP"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
ignore = "0.4"
notify = "8.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
rmcp = { version = "3.1", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "fs", "net", "signal", "sync", "time"] }
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
url = "2.5"
which = "8.0"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# Preserve vectorized hashing while the rest of the executable optimizes for size.
[profile.release.package.sha2]
opt-level = 3

# Keep archive decompression on its throughput-oriented path.
[profile.release.package.zlib-rs]
opt-level = 3

# Workspace scanning stays on the global size profile; ablation found no stable regression.
