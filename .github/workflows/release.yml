name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  wait-for-ci:
    name: Wait for main CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
      commit: ${{ steps.ci.outputs.commit }}

    steps:
      - name: Wait for matching main CI run
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-fix)?$ ]]; then
            echo "Release tag '$RELEASE_TAG' must match vX.Y.Z or vX.Y.Z-fix" >&2
            exit 1
          fi

          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          run_id=""
          for _ in {1..12}; do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch main \
              --commit "$commit" \
              --event push \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "No main CI run found for release commit '$commit'" >&2
            exit 1
          fi

          run_sha="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          if [[ "$run_sha" != "$commit" ]]; then
            echo "Main CI run '$run_id' belongs to '$run_sha', not release commit '$commit'" >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --compact --exit-status

          artifact_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "release-candidate" and .expired == false)][0].id // empty')"
          if [[ -z "$artifact_id" ]]; then
            echo "Main CI run '$run_id' has no unexpired 'release-candidate' artifact; rerun that CI or use its historical release workflow" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  prepare:
    needs: wait-for-ci
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "1.97.1"
          $actual = (& rustc --version) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -notmatch "^rustc $expected ") {
              throw "Rust $expected is required; got '$($actual.Trim())'"
          }
          (& cargo --version) | Out-Host

      - name: Validate tag, release notes, and versions
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = $env:RELEASE_TAG
          if ($tag -notmatch "^v[0-9]+[.][0-9]+[.][0-9]+(?:-fix)?$") {
              throw "Release tag '$tag' must match vX.Y.Z or vX.Y.Z-fix"
          }

          $tagType = & git cat-file -t "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0 -or ([string]$tagType).Trim() -ne "tag") {
              throw "Release tag '$tag' must be an annotated tag"
          }

          $notes = (& git for-each-ref --format="%(contents:body)" "refs/tags/$tag") -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($notes)) {
              throw "Annotated tag '$tag' must contain release notes in its body"
          }
          $notes = $notes.Trim()
          $version = $tag.Substring(1)
          $isPrerelease = $version.EndsWith("-fix", [StringComparison]::Ordinal)
          if ($isPrerelease) {
              $npmTag = "fix"
          } else {
              $npmTag = "latest"
          }

          $cargoMetadataText = (& cargo metadata --locked --no-deps --format-version 1) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) {
              throw "Cargo metadata or Cargo.lock validation failed"
          }
          $cargoMetadata = $cargoMetadataText | ConvertFrom-Json
          $cargoPackages = @($cargoMetadata.packages | Where-Object { $_.name -eq "clsp" })
          if ($cargoPackages.Count -ne 1) {
              throw "Expected exactly one Cargo package named clsp"
          }

          $rootPackage = Get-Content -LiteralPath package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $vscodePackage = Get-Content -LiteralPath vscode/package.json -Raw -Encoding UTF8 | ConvertFrom-Json

          $versions = [ordered]@{
              "Cargo.toml/Cargo.lock" = [string]$cargoPackages[0].version
              "package.json" = [string]$rootPackage.version
              "vscode/package.json" = [string]$vscodePackage.version
          }
          foreach ($entry in $versions.GetEnumerator()) {
              if ($entry.Value -ne $version) {
                  throw "$($entry.Key) version '$($entry.Value)' does not match tag version '$version'"
              }
          }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $notesPath = Join-Path $PWD "dist/release-notes.md"
          [IO.File]::WriteAllText(
              $notesPath,
              "$notes$([Environment]::NewLine)",
              [Text.UTF8Encoding]::new($false)
          )
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "npm_tag=$npmTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download exact release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.wait-for-ci.outputs.run_id }}

      - name: Verify exact release candidate
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ needs.wait-for-ci.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION
          $expectedCommit = $env:RELEASE_COMMIT

          $tagCommit = ((& git rev-parse HEAD) -join [Environment]::NewLine).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $expectedCommit) {
              throw "Checked out tag commit '$tagCommit' does not match main CI commit '$expectedCommit'"
          }

          $candidatePath = Join-Path $PWD "dist/release-candidate.json"
          $candidate = Get-Content -LiteralPath $candidatePath -Raw -Encoding UTF8 | ConvertFrom-Json
          $candidateProperties = @($candidate.PSObject.Properties.Name) | Sort-Object
          $propertyDiff = Compare-Object -ReferenceObject @("commit", "version") -DifferenceObject $candidateProperties
          if ($propertyDiff) {
              throw "Unexpected release candidate metadata fields: $($propertyDiff | Out-String)"
          }
          $candidateCommit = [string]$candidate.commit
          $candidateVersion = [string]$candidate.version
          if ($candidateCommit -ne $expectedCommit) {
              throw "Release candidate commit '$candidateCommit' does not match '$expectedCommit'"
          }
          if ($candidateVersion -ne $version) {
              throw "Release candidate version '$candidateVersion' does not match '$version'"
          }

          $expectedFiles = @(
              "SHA256SUMS.txt"
              "clsp-$version-windows-x64.zip"
              "clsp-$version.tgz"
              "release-candidate.json"
              "release-notes.md"
          ) | Sort-Object
          $actualFiles = @(
              Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.Name }
          ) | Sort-Object
          $fileDiff = Compare-Object -ReferenceObject $expectedFiles -DifferenceObject $actualFiles
          if ($fileDiff) {
              throw "Unexpected verified release file list: $($fileDiff | Out-String)"
          }

          $zipPath = (Resolve-Path -LiteralPath "dist/clsp-$version-windows-x64.zip").Path
          $tgzPath = (Resolve-Path -LiteralPath "dist/clsp-$version.tgz").Path
          $actualChecksums = @($zipPath, $tgzPath) | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path -Leaf $_)"
          } | Sort-Object
          $recordedChecksums = @(
              Get-Content -LiteralPath dist/SHA256SUMS.txt -Encoding UTF8 |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          ) | Sort-Object
          $checksumDiff = Compare-Object -ReferenceObject $actualChecksums -DifferenceObject $recordedChecksums
          if ($checksumDiff) {
              throw "Release candidate checksum mismatch: $($checksumDiff | Out-String)"
          }

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.release.outputs.version }}
          path: |
            dist/clsp-${{ steps.release.outputs.version }}-windows-x64.zip
            dist/clsp-${{ steps.release.outputs.version }}.tgz
            dist/SHA256SUMS.txt
            dist/release-candidate.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Setup Node.js for npm OIDC
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          scope: "@dslzl"

      - name: Verify npm trusted publishing support
        shell: pwsh
        run: |
          $npmVersionText = (& npm --version).Trim()
          if ($LASTEXITCODE -ne 0 -or [version]$npmVersionText -lt [version]"11.5.1") {
              throw "npm 11.5.1 or newer is required for trusted publishing"
          }

      - name: Download verified release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          $arguments = @(
              "release", "create", $env:RELEASE_TAG
              "dist/clsp-$($env:RELEASE_VERSION)-windows-x64.zip"
              "dist/clsp-$($env:RELEASE_VERSION).tgz"
              "dist/SHA256SUMS.txt"
              "--repo", $env:GITHUB_REPOSITORY
              "--title", $env:RELEASE_VERSION
              "--notes-file", "dist/release-notes.md"
              "--draft"
              "--verify-tag"
          )
          if ($env:RELEASE_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
              $arguments += "--latest=false"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish npm package with OIDC
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        run: npm publish "./dist/clsp-$($env:RELEASE_VERSION).tgz" --access public --provenance --tag $env:NPM_TAG

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          $arguments = @(
              "release", "edit", $env:RELEASE_TAG
              "--repo", $env:GITHUB_REPOSITORY
              "--draft=false"
          )
          if ($env:RELEASE_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
              $arguments += "--latest=false"
          } else {
              $arguments += "--latest"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
