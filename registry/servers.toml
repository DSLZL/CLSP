[[server]]
id = "astro"
display_name = "Astro Language Server"
language_id = "astro"
version_req = ">=2.16.0, <3.0.0"
extensions = ["astro"]
markers = ["astro.config.js", "astro.config.mjs", "astro.config.ts"]
command = "astro-ls"
args = ["--stdio"]
version_args = ["--version"]
install = { kind = "npm", version = "2.16.13", package = "@astrojs/language-server", companions = ["typescript@5.9.2"] }

[[server]]
id = "rust"
display_name = "rust-analyzer"
language_id = "rust"
version_req = ">=1.75.0"
extensions = ["rs"]
markers = ["Cargo.toml", "rust-project.json"]
command = "rust-analyzer"
args = []
version_args = ["--version"]
install = { kind = "command", version = "rustup-component", program = "rustup", args = ["component", "add", "rust-analyzer"] }

[[server]]
id = "typescript"
display_name = "TypeScript Language Server"
language_id = "typescript"
version_req = ">=4.0.0, <5.0.0"
extensions = ["ts", "tsx", "js", "jsx", "mjs", "cjs", "mts", "cts"]
markers = ["package.json", "tsconfig.json", "jsconfig.json"]
command = "typescript-language-server"
args = ["--stdio"]
version_args = ["--version"]
install = { kind = "npm", version = "4.4.0", package = "typescript-language-server", companions = ["typescript@5.9.2"] }

[[server]]
id = "pyright"
display_name = "Pyright"
language_id = "python"
version_req = ">=1.1.300, <2.0.0"
extensions = ["py", "pyi"]
markers = ["pyproject.toml", "pyrightconfig.json", "setup.py", "requirements.txt"]
command = "pyright-langserver"
args = ["--stdio"]
version_args = ["--version"]
install = { kind = "npm", version = "1.1.405", package = "pyright", companions = [] }

[[server]]
id = "gopls"
display_name = "gopls"
language_id = "go"
version_req = ">=0.15.0, <1.0.0"
extensions = ["go"]
markers = ["go.work", "go.mod"]
command = "gopls"
args = []
version_args = ["version"]
install = { kind = "command", version = "v0.19.1", program = "go", args = ["install", "golang.org/x/tools/gopls@v0.19.1"] }

[[server]]
id = "clangd"
display_name = "clangd"
language_id = "cpp"
version_req = ">=16.0.0"
extensions = ["c", "cpp", "cc", "cxx", "c++", "h", "hpp", "hh", "hxx", "h++"]
markers = ["compile_commands.json", "compile_flags.txt", "CMakeLists.txt", ".clangd"]
command = "clangd"
args = []
version_args = ["--version"]
install = { kind = "manual", version = "system", hint = "Install clangd locally or set lsp.clangd.executable in .clsp.toml" }

[[server]]
id = "yaml-ls"
display_name = "YAML Language Server"
language_id = "yaml"
version_req = ">=1.14.0, <2.0.0"
extensions = ["yaml", "yml"]
markers = [".yamllint", ".yamllint.yml"]
command = "yaml-language-server"
args = ["--stdio"]
version_args = ["--version"]
install = { kind = "npm", version = "1.18.0", package = "yaml-language-server", companions = [] }
