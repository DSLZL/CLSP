[[server]]
id = "astro"
display_name = "Astro Language Server"
language_id = "astro"
version_req = ">=2.16.0, <3.0.0"
extensions = ["astro"]
markers = ["astro.config.js", "astro.config.mjs", "astro.config.ts"]
command = "astro-ls"
args = ["--stdio"]
version_args = ["--version"]
install = { kind = "npm", version = "2.16.13", package = "@astrojs/language-server", companions = ["typescript@5.9.2"] }

[[server]]
id = "bash"
display_name = "Bash Language Server"
language_id = "shellscript"
version_req = ">=5.6.0, <6.0.0"
extensions = ["sh", "bash", "zsh", "ksh"]
markers = [".shellcheckrc"]
command = "bash-language-server"
args = ["start"]
version_args = ["--version"]
install = { kind = "npm", version = "5.6.0", package = "bash-language-server", companions = [] }

[[server]]
id = "csharp"
display_name = "Roslyn Language Server"
language_id = "csharp"
version_req = "=5.9.0-1.26303.1"
extensions = ["cs", "csx"]
markers = ["*.slnx", "*.sln", "*.csproj", "global.json"]
command = "roslyn-language-server"
args = ["--stdio", "--autoLoadProjects"]
version_args = ["--version"]
install = { kind = "command", version = "5.9.0-1.26303.1", program = "dotnet", args = ["tool", "install", "--global", "roslyn-language-server", "--version", "5.9.0-1.26303.1"] }

[[server]]
id = "clojure-lsp"
display_name = "clojure-lsp"
language_id = "clojure"
version_req = ">=2026.7.6, <2027.0.0"
extensions = ["clj", "cljs", "cljc", "edn"]
markers = ["deps.edn", "project.clj", "shadow-cljs.edn", "bb.edn", "build.boot"]
command = "clojure-lsp"
args = ["listen"]
version_args = ["--version"]
install = { kind = "manual", version = "2026.07.06-14.34.19", hint = "Install clojure-lsp 2026.07.06-14.34.19 and a Clojure build tool, then ensure clojure-lsp is on PATH; on Windows use the official scoop-clojure bucket" }

[[server]]
id = "dart"
display_name = "Dart Language Server"
language_id = "dart"
version_req = ">=2.12.0"
extensions = ["dart"]
markers = ["pubspec.yaml", "analysis_options.yaml"]
command = "dart"
args = ["language-server", "--protocol=lsp"]
version_args = ["--version"]
install = { kind = "manual", version = "Dart SDK 2.12.0+", hint = "Install Dart SDK 2.12.0 or newer (or Flutter with its bundled Dart SDK), then ensure dart is on PATH or set [lsp.dart].executable" }

[[server]]
id = "rust"
display_name = "rust-analyzer"
language_id = "rust"
version_req = ">=1.75.0"
extensions = ["rs"]
markers = ["Cargo.toml", "rust-project.json"]
command = "rust-analyzer"
args = []
version_args = ["--version"]
install = { kind = "command", version = "rustup-component", program = "rustup", args = ["component", "add", "rust-analyzer"] }

[[server]]
id = "typescript"
display_name = "TypeScript Language Server"
language_id = "typescript"
version_req = ">=4.0.0, <5.0.0"
extensions = ["ts", "tsx", "js", "jsx", "mjs", "cjs", "mts", "cts"]
markers = ["package.json", "tsconfig.json", "jsconfig.json"]
command = "typescript-language-server"
args = ["--stdio"]
version_args = ["--version"]
install = { kind = "npm", version = "4.4.0", package = "typescript-language-server", companions = ["typescript@5.9.2"] }

[[server]]
id = "pyright"
display_name = "Pyright"
language_id = "python"
version_req = ">=1.1.300, <2.0.0"
extensions = ["py", "pyi"]
markers = ["pyproject.toml", "pyrightconfig.json", "setup.py", "requirements.txt"]
command = "pyright-langserver"
args = ["--stdio"]
version_args = ["--version"]
install = { kind = "npm", version = "1.1.405", package = "pyright", companions = [] }

[[server]]
id = "gopls"
display_name = "gopls"
language_id = "go"
version_req = ">=0.15.0, <1.0.0"
extensions = ["go"]
markers = ["go.work", "go.mod"]
command = "gopls"
args = []
version_args = ["version"]
install = { kind = "command", version = "v0.19.1", program = "go", args = ["install", "golang.org/x/tools/gopls@v0.19.1"] }

[[server]]
id = "clangd"
display_name = "clangd"
language_id = "cpp"
version_req = ">=16.0.0"
extensions = ["c", "cpp", "cc", "cxx", "c++", "h", "hpp", "hh", "hxx", "h++"]
markers = ["compile_commands.json", "compile_flags.txt", "CMakeLists.txt", ".clangd"]
command = "clangd"
args = []
version_args = ["--version"]
install = { kind = "github_zip", version = "22.1.6", url = "https://github.com/clangd/clangd/releases/download/22.1.6/clangd-windows-22.1.6.zip", sha256 = "ce54f16e0b4fd76d450eeda9664420b195360b73febcfe40e661108fa57f2ce1", executable = "clangd_22.1.6/bin/clangd.exe" }

[[server]]
id = "yaml-ls"
display_name = "YAML Language Server"
language_id = "yaml"
version_req = ">=1.14.0, <2.0.0"
extensions = ["yaml", "yml"]
markers = [".yamllint", ".yamllint.yml"]
command = "yaml-language-server"
args = ["--stdio"]
version_args = ["--version"]
install = { kind = "npm", version = "1.18.0", package = "yaml-language-server", companions = [] }
